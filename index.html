<!DOCTYPE html>
<html lang="en">
<head>

    <title>ToDoList</title>
    <!-- bootstrap icon -->

    <!-- bootstrap -->

                <div class="body">

                        <span for="inpghad">قد (سانتی متر)</span>

                    </div>
                    <div class="input_group">
                        <span for="inpvazn">وزن (کیلوگرم)</span>
                        <input type="number" id="inpvazn" placeholder="مثال:54" style="text-align: right;">
                    </div>
                    <button class="btnBmi">محاسبه</button>
                </div>
                <div class="resault_box">
                    <h2 class="bmiValue">0</h2>
                    <p class="staus">a</p>
                    <p class="advice">a</p>
                </div>
            </div>
